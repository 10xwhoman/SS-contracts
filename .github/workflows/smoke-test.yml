name: Testnet Smoke Test

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Stellar network to target"
        required: false
        default: "testnet"
        type: choice
        options: [testnet, futurenet]

jobs:
  smoke-test:
    name: Escrow lifecycle smoke test (${{ inputs.network }})
    runs-on: ubuntu-latest
    environment: testnet-smoke   # store secrets in this GitHub environment

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --version 22.0.0 --features opt

      - name: Verify Stellar CLI Version
        run: |
          CLI_VERSION=$(stellar --version 2>/dev/null || soroban --version 2>/dev/null)
          echo "Installed CLI version: $CLI_VERSION"
          echo "$CLI_VERSION" | grep -q "22\.0\.0" || { echo "Error: Stellar CLI version is not 22.0.0" >&2; exit 1; }

      - name: Run smoke test
        env:
          STELLAR_NETWORK: ${{ inputs.network }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SELLER_SECRET: ${{ secrets.SELLER_SECRET }}
          BUYER_SECRET: ${{ secrets.BUYER_SECRET }}
          PAYER_SECRET: ${{ secrets.PAYER_SECRET }}
          USDC_TOKEN_ADDRESS: ${{ secrets.USDC_TOKEN_ADDRESS }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
