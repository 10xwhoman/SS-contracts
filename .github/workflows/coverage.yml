name: Code Coverage

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Differential Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run code coverage
        run: cargo tarpaulin --out Lcov Xml --output-dir coverage

      - name: Generate lcov summary
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.15
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: coverage/lcov.info

      - name: Coverage delta comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const lcovPath = path.join('coverage', 'lcov.info');
            if (!fs.existsSync(lcovPath)) {
              core.warning('lcov.info not found, skipping delta report');
              return;
            }

            const lcov = fs.readFileSync(lcovPath, 'utf8');

            // Parse line coverage from lcov
            const lfMatch = lcov.match(/LF:(\d+)/g);
            const lhMatch = lcov.match(/LH:(\d+)/g);
            let totalLines = 0;
            let hitLines = 0;
            if (lfMatch) lfMatch.forEach(m => { totalLines += parseInt(m.split(':')[1]); });
            if (lhMatch) lhMatch.forEach(m => { hitLines += parseInt(m.split(':')[1]); });

            const pct = totalLines > 0 ? ((hitLines / totalLines) * 100).toFixed(1) : '0.0';

            const body = `## Code Coverage Report\n\n` +
              `| Metric | Value |\n|---|---|\n` +
              `| Lines covered | ${hitLines} / ${totalLines} |\n` +
              `| Coverage | **${pct}%** |\n\n` +
              `_Generated by cargo-tarpaulin on commit ${context.sha.slice(0, 7)}_`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/cobertura.xml
