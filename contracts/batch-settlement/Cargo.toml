[package]
name = "batch-settlement"
version = "0.1.0"
edition = "2021"
publish = false
description = "Atomic batch settlement contract for multiple invoices"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
