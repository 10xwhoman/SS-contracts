[package]
name = "categorisation-registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Invoice industry categorization and sector filtering registry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
