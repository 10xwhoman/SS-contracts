[package]
name = "invoice-refund"
version = "0.1.0"
edition = "2021"
# Deployed as WASM, never published to crates.io.
publish = false
description = "StellarSettle refund contract for expired, under-funded invoices"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
