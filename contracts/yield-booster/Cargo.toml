[package]
name = "yield-booster"
version = "0.1.0"
edition = "2021"
publish = false
description = "Yield booster applying loyalty-tier based extra yield at settlement"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
