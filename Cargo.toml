[workspace]
resolver = "2"
members = [
    "contracts/invoice-escrow",
    "contracts/invoice-token",
    "contracts/payment-distributor",
    "contracts/invoice-refund",
    "contracts/invoice-maturity",
    "contracts/invoice-snapshot",
    "contracts/multisig-admin",
]

[workspace.dependencies]
soroban-sdk = "27.0.2"
soroban-env-host = "27.0.2"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
