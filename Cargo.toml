[workspace]
resolver = "2"
members = [
    "contracts/auto-invest",
    "contracts/batch-settlement",
    "contracts/bulk-listing",
    "contracts/categorisation-registry",
    "contracts/fee-treasury",
    "contracts/interest-rate-oracle",
    "contracts/investment-limit",
    "contracts/investor-notifications",
    "contracts/investor-scoring",
    "contracts/invoice-escrow",
    "contracts/invoice-pool",
    "contracts/invoice-token",
    "contracts/loyalty-tier",
    "contracts/nonce-registry",
    "contracts/order-book",
    "contracts/partial-settlement",
    "contracts/payment-distributor",
    "contracts/yield-accrual",
    "contracts/yield-booster",
    "contracts/yield-vesting",
]

[workspace.dependencies]
soroban-sdk = "27.0.2"
soroban-env-host = "27.0.2"
proptest = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
